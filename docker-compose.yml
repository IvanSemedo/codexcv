services:
  # ======================
  # MySQL
  # ======================
  codexj6_db:
    image: mysql:8.4
    container_name: codexj6_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/db:/var/lib/mysql
    networks:
      - codexj6_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ======================
  # Joomla
  # ======================
  codexj6_web:
    image: joomla:6-apache
    container_name: codexj6_web
    restart: unless-stopped
    ports:
      - "${JOOMLA_PORT}:80"
    environment:
      JOOMLA_DB_HOST: codexj6_db
      JOOMLA_DB_USER: ${MYSQL_USER}
      JOOMLA_DB_PASSWORD: ${MYSQL_PASSWORD}
      JOOMLA_DB_NAME: ${MYSQL_DATABASE}
      JOOMLA_SITE_NAME: ${JOOMLA_SITE_NAME}
      JOOMLA_ADMIN_USER: ${JOOMLA_ADMIN_USER}
      JOOMLA_ADMIN_USERNAME: ${JOOMLA_ADMIN_USERNAME}
      JOOMLA_ADMIN_PASSWORD: ${JOOMLA_ADMIN_PASSWORD}
      JOOMLA_ADMIN_EMAIL: ${JOOMLA_ADMIN_EMAIL}
    volumes:
      - ./data/www:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./custom.css:/var/www/html/templates/shaper_helixultimate/css/custom.css
      - ./php/carousel.php:/var/www/html/templates/shaper_helixultimate/html/mod_articles_news/carousel.php
    depends_on:
      codexj6_db:
        condition: service_healthy
    networks:
      - codexj6_network

  # ======================
  # phpMyAdmin
  # ======================
  codexj6_pma:
    image: phpmyadmin:latest
    container_name: codexj6_pma
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: codexj6_db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 64M
    depends_on:
      - codexj6_db
    networks:
      - codexj6_network

networks:
  codexj6_network:
    driver: bridge